<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Quizzes · Projector</title>
    <link rel="stylesheet" href="/styles.css?v=0.9.0-rc.21" />
  </head>
  <body class="projector-page">
    <header class="projector-head">
      <a href="/" class="projector-brand">Q <span>Quizzes</span></a
      ><span id="displayTitle">Audience display</span
      ><span class="projector-code" id="displayCode"></span
      ><button id="displayFullscreen" class="secondary-btn">Full screen</button>
    </header>
    <main id="displayStage" class="projector-stage">
      <p>Connecting to the room…</p>
    </main>
    <footer class="projector-footer">
      <span id="displayConnection" role="status"
        >This is a read-only audience display.</span
      ><span id="displayCount"></span>
    </footer>
    <script src="/qr-code.js?v=0.9.0-rc.21"></script>
    <script src="/characters.js?v=0.9.0-rc.21"></script>
    <link rel="stylesheet" href="/characters.css?v=0.9.0-rc.21" />
    <script src="/display.js?v=0.9.0-rc.21"></script>
  </body>
</html>
